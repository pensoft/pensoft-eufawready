<div class="profile-content" data-profile-id="{{ item.id }}">
    {% if item.avatar %}
    <div class="advisory-popup-avatar">
        <img src="{{ item.avatar.path }}"
             alt="Portrait of {{ item.names }}, {{ item.position }}"
             class="advisory-popup-avatar-img" />
    </div>
    {% endif %}

    <div class="advisory-popup-info">
        <h2 class="advisory-popup-name" tabindex="-1">{{ item.names }}</h2>

        {% if item.position %}
        <p class="advisory-popup-position">{{ item.position }}</p>
        {% endif %}

        {% if item.content %}
        <div class="advisory-popup-content">{{ item.content | striptags | raw }}</div>
        {% endif %}
    </div>
</div>
