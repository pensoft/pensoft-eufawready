<div class="modal-overlay partner-project-modal"
     id="partnerProjectModal"
     role="dialog"
     aria-modal="true"
     aria-labelledby="partnerProjectPopupLabel"
     aria-describedby="partnerProjectPopupContent"
     aria-hidden="true">
    <div class="modal-container partner-project-modal-container" role="document">
        <!-- Close Button -->
        <button class="modal-close partner-project-modal-close"
                id="partnerProjectModalClose"
                aria-label="Close modal"
                type="button">
            <img src="{{ 'assets/images/close-icon.svg' | theme }}"
                 alt="Close"
                 class="close-icon"
                 aria-hidden="true" />
        </button>

        <!-- Modal Content - Populated by JavaScript -->
        <div class="modal-content partner-project-modal-content" id="partnerProjectModalContent">
            <!-- Content will be cloned here from pre-rendered divs -->
        </div>
    </div>
</div>
