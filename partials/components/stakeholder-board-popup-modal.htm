<div class="modal-overlay profile-popup-modal"
     id="stakeholderBoardModal"
     role="dialog"
     aria-modal="true"
     aria-labelledby="profilePopupName"
     aria-describedby="profilePopupContent"
     aria-hidden="true">
    <div class="modal-container profile-popup-modal-container" role="document">
        <!-- Close Button -->
        <button class="modal-close profile-popup-modal-close"
                id="stakeholderBoardModalClose"
                aria-label="Close modal"
                type="button">
            <img src="{{ 'assets/images/close-icon.svg' | theme }}"
                 alt="Close"
                 class="close-icon"
                 aria-hidden="true" />
        </button>

        <!-- Modal Content - Populated by JavaScript -->
        <div class="modal-content profile-popup-modal-content" id="stakeholderModalContent">
            <!-- Content will be cloned here from pre-rendered divs -->
        </div>
    </div>
</div>
